<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Misti AI — Your Smart Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Sidebar Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <span class="logo-icon">⬡</span>
        <span class="logo-text">Misti AI</span>
      </div>
      <button class="sidebar-close" id="sidebarClose" aria-label="Close sidebar">✕</button>
    </div>

    <!-- User Info -->
    <div class="sidebar-user" id="sidebarUser">
      <div class="user-avatar" id="userAvatar">?</div>
      <div class="user-info">
        <span class="user-name" id="userName">...</span>
        <span class="user-label">Signed in</span>
      </div>
      <button class="logout-btn" id="logoutBtn" title="Sign out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Chat
    </button>

    <div class="sidebar-section-label">Recent Chats</div>

    <div class="chat-history" id="chatHistory">
      <div class="chat-history-empty" id="historyEmpty">
        <span>💬</span>
        <p>No previous chats yet</p>
        <small>Start a conversation!</small>
      </div>
    </div>
  </aside>

  <!-- Main App -->
  <div class="app-wrapper">

    <!-- Header -->
    <header class="app-header">
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <div class="header-info">
        <h1 class="header-title">Misti AI</h1>
        <p class="header-subtitle">your smart assistant · Built by Raj</p>
      </div>
      <div class="header-status">
        <span class="status-dot"></span>
      </div>
    </header>

    <!-- Chat Area -->
    <main class="chat-area" id="chatArea">

      <!-- Welcome Screen -->
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-icon">⬡</div>
        <h2 class="welcome-title">Hello! I'm Misti AI</h2>
        <p class="welcome-sub">Your smart assistant, ready to help with anything.</p>
        <div class="welcome-chips">
          <button class="chip" onclick="fillInput('Explain quantum computing simply')">⚛️ Explain quantum computing</button>
          <button class="chip" onclick="fillInput('Write a short poem about the ocean')">🌊 Write a poem</button>
          <button class="chip" onclick="fillInput('What are the best productivity tips?')">💡 Productivity tips</button>
          <button class="chip" onclick="fillInput('Help me debug my Python code')">🐍 Debug Python code</button>
        </div>
      </div>

      <!-- Messages Container -->
      <div class="messages-container" id="messagesContainer"></div>

      <!-- Typing Indicator -->
      <div class="typing-indicator" id="typingIndicator" style="display:none;">
        <div class="typing-bubble">
          <span></span><span></span><span></span>
        </div>
        <span class="typing-label">Misti AI is thinking...</span>
      </div>

    </main>

    <!-- Scroll to Bottom Button -->
    <button class="scroll-bottom-btn" id="scrollBottomBtn" style="display:none;" aria-label="Scroll to bottom">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>

    <!-- Image Preview Bar -->
    <div class="image-preview-bar" id="imagePreviewBar" style="display:none;">
      <div class="image-preview-inner">
        <img src="" alt="Attached image" id="imagePreviewThumb" />
        <div class="image-preview-info">
          <span class="image-preview-name" id="imagePreviewName">image.jpg</span>
          <span class="image-preview-size" id="imagePreviewSize">0 KB</span>
        </div>
        <button class="image-remove-btn" id="imageRemoveBtn" aria-label="Remove image">✕</button>
      </div>
    </div>

    <!-- Input Area -->
    <footer class="input-area">
      <div class="input-box">
        <label class="attach-btn" for="imageInput" title="Attach image" aria-label="Attach image">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </label>
        <input type="file" id="imageInput" accept="image/*" style="display:none;" />
        <textarea
          id="messageInput"
          placeholder="Ask anything..."
          rows="1"
          autocomplete="off"
          spellcheck="true"
        ></textarea>
        <button class="send-btn" id="sendBtn" aria-label="Send message" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </footer>

  </div>

  <!-- Copy Toast -->
  <div class="copy-toast" id="copyToast">✓ Copied!</div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
