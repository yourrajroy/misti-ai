<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Misti AI — {{ 'Sign In' if mode == 'login' else 'Create Account' }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <style>
    html, body { overflow: auto; }

    .auth-page {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-main);
      padding: 24px 16px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 28px;
      padding: 40px 36px 36px;
      box-shadow: 0 12px 48px rgba(124,58,237,0.13), 0 2px 8px rgba(0,0,0,0.06);
      border: 1.5px solid rgba(124,58,237,0.10);
      animation: cardIn 0.4s cubic-bezier(.4,0,.2,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to   { opacity: 1; transform: none; }
    }

    .auth-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin-bottom: 28px;
    }
    .auth-logo-icon {
      font-size: 28px;
      background: var(--header-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .auth-logo-text {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.4px;
    }

    .auth-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
      margin-bottom: 6px;
    }
    .auth-sub {
      font-size: 13.5px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-field {
      margin-bottom: 16px;
    }
    .auth-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .auth-input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid rgba(124,58,237,0.18);
      border-radius: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: var(--text-primary);
      background: #fafafa;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .auth-input:focus {
      border-color: var(--purple-mid);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(124,58,237,0.10);
    }
    .auth-input::placeholder { color: var(--text-muted); }

    .auth-error {
      background: rgba(255,80,80,0.08);
      border: 1.5px solid rgba(255,80,80,0.25);
      border-radius: 12px;
      color: #c0392b;
      font-size: 13.5px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: none;
      animation: shake 0.3s ease;
    }
    .auth-error.show { display: block; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-6px); }
      75%      { transform: translateX(6px); }
    }

    .auth-btn {
      width: 100%;
      padding: 14px;
      background: var(--send-gradient);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 4px 18px rgba(124,58,237,0.35);
      transition: opacity 0.2s, transform 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .auth-btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .auth-btn:active { transform: scale(0.97); }
    .auth-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .auth-divider {
      text-align: center;
      margin: 22px 0 18px;
      font-size: 13px;
      color: var(--text-muted);
      position: relative;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 38%;
      height: 1px;
      background: rgba(124,58,237,0.12);
    }
    .auth-divider::before { left: 0; }
    .auth-divider::after  { right: 0; }

    .auth-switch {
      text-align: center;
      font-size: 14px;
      color: var(--text-secondary);
    }
    .auth-switch a {
      color: var(--purple-mid);
      font-weight: 600;
      text-decoration: none;
    }
    .auth-switch a:hover { text-decoration: underline; }

    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }
    .spinner.show { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .auth-card { padding: 32px 22px 28px; }
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">

      <div class="auth-logo">
        <span class="auth-logo-icon">⬡</span>
        <span class="auth-logo-text">Misti AI</span>
      </div>

      {% if mode == 'login' %}
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-sub">Sign in to continue your conversations</p>
      {% else %}
        <h1 class="auth-title">Create your account</h1>
        <p class="auth-sub">Join Misti AI and start chatting</p>
      {% endif %}

      <div class="auth-error" id="authError"></div>

      {% if mode == 'register' %}
        <div class="auth-field">
          <label class="auth-label" for="username">Username</label>
          <input class="auth-input" type="text" id="username" placeholder="e.g. raj123" autocomplete="username" maxlength="32" />
        </div>
        <div class="auth-field">
          <label class="auth-label" for="email">Email</label>
          <input class="auth-input" type="email" id="email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="auth-field">
          <label class="auth-label" for="password">Password <span style="font-weight:400;text-transform:none;letter-spacing:0">(min 6 chars)</span></label>
          <input class="auth-input" type="password" id="password" placeholder="••••••••" autocomplete="new-password" />
        </div>
        <button class="auth-btn" id="authBtn" onclick="doRegister()">
          <span id="btnLabel">Create Account</span>
          <div class="spinner" id="spinner"></div>
        </button>
        <div class="auth-divider">or</div>
        <div class="auth-switch">Already have an account? <a href="/login">Sign in</a></div>
      {% else %}
        <div class="auth-field">
          <label class="auth-label" for="identifier">Username or Email</label>
          <input class="auth-input" type="text" id="identifier" placeholder="raj123 or you@example.com" autocomplete="username" />
        </div>
        <div class="auth-field">
          <label class="auth-label" for="password">Password</label>
          <input class="auth-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button class="auth-btn" id="authBtn" onclick="doLogin()">
          <span id="btnLabel">Sign In</span>
          <div class="spinner" id="spinner"></div>
        </button>
        <div class="auth-divider">or</div>
        <div class="auth-switch">Don't have an account? <a href="/register">Sign up</a></div>
      {% endif %}

    </div>
  </div>

  <script>
    // Allow Enter key on all inputs
    document.querySelectorAll(".auth-input").forEach(input => {
      input.addEventListener("keydown", e => {
        if (e.key === "Enter") {
          document.getElementById("authBtn").click();
        }
      });
    });

    function setLoading(on) {
      const btn     = document.getElementById("authBtn");
      const label   = document.getElementById("btnLabel");
      const spinner = document.getElementById("spinner");
      btn.disabled = on;
      label.style.display  = on ? "none" : "inline";
      spinner.classList.toggle("show", on);
    }

    function showError(msg) {
      const el = document.getElementById("authError");
      el.textContent = msg;
      el.classList.remove("show");
      void el.offsetWidth; // reflow to restart shake animation
      el.classList.add("show");
    }

    async function doRegister() {
      const username = document.getElementById("username").value.trim();
      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!username || !email || !password) { showError("Please fill in all fields."); return; }

      setLoading(true);
      try {
        const res  = await fetch("/api/auth/register", {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        if (data.error) { showError(data.error); setLoading(false); return; }
        window.location.href = "/";
      } catch {
        showError("Network error. Please try again.");
        setLoading(false);
      }
    }

    async function doLogin() {
      const identifier = document.getElementById("identifier").value.trim();
      const password   = document.getElementById("password").value;

      if (!identifier || !password) { showError("Please fill in all fields."); return; }

      setLoading(true);
      try {
        const res  = await fetch("/api/auth/login", {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ identifier, password })
        });
        const data = await res.json();
        if (data.error) { showError(data.error); setLoading(false); return; }
        window.location.href = "/";
      } catch {
        showError("Network error. Please try again.");
        setLoading(false);
      }
    }
  </script>
</body>
</html>
